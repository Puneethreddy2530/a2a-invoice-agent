name: Mailroom protocol smoke tests

on:
  push:
    branches: [main]
    paths:
      - "mailroom_agent/**"
      - "mailroom_smoke_test.py"
      - "main.py"
      - "requirements.txt"
      - "Dockerfile"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mailroom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run signed receipt and replay tests
        run: python mailroom_smoke_test.py
