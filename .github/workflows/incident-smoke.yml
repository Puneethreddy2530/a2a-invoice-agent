name: Incident agent smoke tests

on:
  push:
    branches: [main]
    paths:
      - "incident_service.py"
      - "incident_planner.py"
      - "incident_smoke_test.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run incident regressions
        run: python incident_smoke_test.py
