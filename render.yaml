services:
  - type: web
    name: a2a-invoice-agent
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-4.1-nano
      - key: LLM_BASE_URL
        value: https://aipipe.org/openrouter/v1
      - key: A2A_API_TOKEN
        sync: false
      - key: AUTO_APPROVAL_LIMIT
        value: ""